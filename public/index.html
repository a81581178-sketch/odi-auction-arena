
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODI Auction Arena</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      background: #087f5b;
      padding: 25px;
    }
    .container {
      padding: 25px;
    }
    .card {
      background: #1e293b;
      padding: 22px;
      margin: 20px auto;
      border-radius: 12px;
      max-width: 450px;
    }
    input, button {
      padding: 12px;
      margin: 8px;
      border-radius: 7px;
      border: none;
    }
    button {
      background: #16a34a;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏏 ODI AUCTION ARENA</h1>
    <p>Multiplayer Cricket Auction</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>Create Your Team</h2>
      <input id="team" placeholder="Enter team name">
      <button onclick="createTeam()">Create Team</button>
      <p id="message"></p>
    </div>
    <div class="card">
      <h2>Welcome to the Auction!</h2>
      <p>Build your dream ODI cricket team.</p>
      <p>More auction features coming next.</p>
    </div>
  </div>
  <script>
    function createTeam() {
      const name = document.getElementById("team").value.trim();
      document.getElementById("message").textContent =
        name ? "Team created: " + name : "Please enter a team name.";
    }
  </script>
</body>
</html>
